let cat = "all"; const tagOn = new Set();
try { const h = location.hash.slice(1); if (CATS.some(c => c.k === h)) cat = h; } catch(e){}
const under60 = t => { const m = /^~?(\d+)$/.exec(t); return !!m && +m[1] < 60; };
const icon = c => `<svg viewBox="0 0 24 24" aria-hidden="true">${(CATS.find(x => x.k === c)||{}).ic||""}</svg>`;
const minTxt = (t, L) => t === "—" ? "" : (/^[~]?\d+$/.test(t) ? t + " " + (L === "en" ? "min" : "dk") : (L === "en" ? t.replace(" sa ", " h ").replace(" sa", " h").replace(" dk"," min") : t));
window.renderPage = function(L, t){
  const $ = id => document.getElementById(id);
  $("catChips").innerHTML = `<button type="button" class="chip" data-cat="all" aria-pressed="${cat==="all"}">${t.all}</button>` +
    CATS.map(c => `<button type="button" class="chip" style="--c:var(--c-${c.k})" data-cat="${c.k}" aria-pressed="${cat===c.k}">${icon(c.k)}${c[L]}</button>`).join("");
  $("tagChips").innerHTML = ["u60","bay","kids","nocar"].map(k => `<button type="button" class="chip" data-tag="${k}" aria-pressed="${tagOn.has(k)}">${t[k]}</button>`).join("");
  const has = (p,k) => k === "u60" ? under60(p.t) : p.tags.includes(k);
  const list = PLACES.filter(p => (cat === "all" || p.cat === cat) && [...tagOn].every(k => has(p,k)));
  $("count").textContent = COUNT[L](list.length);
  $("grid").innerHTML = list.length ? list.map(p => {
    const c = CATS.find(x => x.k === p.cat), tm = minTxt(p.t, L);
    return `<article class="card" style="--c:var(--c-${p.cat})">
      <div class="card-top"><span class="cat">${icon(p.cat)}${c[L]}</span>${tm ? `<span class="time" title="${t.from}">${tm}</span>` : ""}</div>
      <div class="card-body">
        <h3>${p.name[L]}</h3>
        <p>${p.d[L]}</p>
        ${p.tags.filter(k => k !== "bay").length ? `<div class="tags-row">${p.tags.filter(k => k !== "bay").map(k => `<span class="tag ${k==="kids"?"k":k==="boat"?"b":""}">${t[k]}</span>`).join("")}</div>` : ""}
        ${p.q ? `<a class="dir" href="https://www.google.com/maps/dir/?api=1&origin=36.8134305,28.7721896&destination=${encodeURIComponent(p.q)}">${t.dir} →</a>` : ""}
      </div>
    </article>`; }).join("") : `<p class="empty">${t.none}</p>`;
};
document.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  if (b.dataset.cat) { cat = b.dataset.cat; try { history.replaceState(null, "", cat === "all" ? location.pathname : "#" + cat); } catch(err){} }

  const L = window.siteLang(); window.renderPage(L, Object.assign({}, window.PAGE_T[L]));
});
