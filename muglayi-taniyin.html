<script>
window.PAGE_T = {"tr": {"pageTitle": "Muğla’yı Tanıyın · Sevilen Konaklama", "eyebrow": "Biliyor muydunuz?", "h1": "Muğla’yı Tanıyın", "lead": "Kaplumbağalardan çam balına, kaya mezarlarından hayalet köye: tatilinizi daha da anlamlı kılacak küçük bilgiler.", "draft": "Taslak: içerik geliştiriliyor", "factsH": "İlginç bilgiler", "blogH": "Blog yazıları", "blogLead": "Bölgenin yerlerini, tarihini ve lezzetlerini anlatan yazılar hazırlanıyor.", "soon": "Yakında"}, "en": {"pageTitle": "Discover Muğla · Sevilen Konaklama", "eyebrow": "Did you know?", "h1": "Discover Muğla", "lead": "From sea turtles to pine honey, from rock tombs to a ghost village: small stories that make your holiday richer.", "draft": "Draft: content in progress", "factsH": "Interesting facts", "blogH": "Blog posts", "blogLead": "Stories about the region’s places, history and food are on their way.", "soon": "Coming soon"}};
const FACTS = [{"c": "sea", "big": "1,1 m", "tr": ["Caretta caretta’yı tanıyın", "Boyu 1,1 metreye, kilosu 135 kg’a ulaşabilir ve 60 yıla kadar yaşayabilir. Dişiler 25–30 yaşında, yumurtadan çıktıkları kumsala geri dönüp her yuvaya 70–100 yumurta bırakır. Yavruların cinsiyetini kumun sıcaklığı belirler: sıcak kum dişi, serin kum erkek yavru demek."], "en": ["Meet the loggerhead turtle", "It can grow to 1.1 m and 135 kg and live up to 60 years. At 25–30, females return to the beach where they hatched and lay 70–100 eggs per nest. Sand temperature decides the hatchlings’ sex: warm sand makes females, cool sand males."]}, {"c": "sea", "big": "Tuba", "tr": ["Bir kaplumbağanın yolculuğu", "2019’da İztuzu’dan uydu vericisiyle bırakılan Tuba, Türkiye’den Adriyatik’e kadar izlenen ilk deniz kaplumbağası oldu: Marmaris açıklarından Yunanistan’a, oradan Malta, İtalya ve Hırvatistan kıyılarına yüzdü."], "en": ["One turtle’s journey", "Released from İztuzu with a satellite tag in 2019, Tuba became the first sea turtle tracked from Türkiye to the Adriatic, swimming from off Marmaris to Greece, then along the coasts of Malta, Italy and Croatia."]}, {"c": "dinner", "big": "~30 ton", "tr": ["Atlantik’ten gelen mavi yengeç", "Mavi yengecin anavatanı Batı Atlantik; Akdeniz’e gemilerin balast sularıyla geldi. Bir zamanlar ağları yırttığı için balıkçıların korkulu rüyasıydı, bugün Dalyan’ın meşhur lezzeti. Dalyan Kanalı’nda yılda 30 ton civarında avlanıyor; dişiler üremeleri için suya geri bırakılıyor."], "en": ["The blue crab from the Atlantic", "The blue crab is native to the western Atlantic and reached the Mediterranean in ships’ ballast water. Once a nuisance that tore fishing nets, it is now Dalyan’s famous dish. About 30 tonnes a year are caught in the Dalyan canal, and females are released so they can breed."]}, {"c": "activity", "big": "1981", "tr": ["Dalaman Havalimanı", "İnşaatına 1976’da başlanan havalimanı 1981’de uluslararası uçuşlara açıldı. 2025’te 5,6 milyon yolcu ağırladı; Türkiye’nin turizm havalimanları arasında Antalya ve İzmir’den sonra üçüncü."], "en": ["Dalaman Airport", "Construction began in 1976 and the airport opened to international flights in 1981. In 2025 it handled 5.6 million passengers, third among Türkiye’s tourism airports after Antalya and İzmir."]}, {"c": "sea", "big": "7 km", "tr": ["Sarıgerme kumsalı", "Sarıgerme’nin 7 km’lik ince, altın renkli kumsalının en ünlü bölümü SARÇED Plajı: 200 m uzunluğunda, 100 m genişliğinde ve 2007’den beri her yıl Mavi Bayrak alıyor. Karşısındaki Baba Adası ilk dalış deneyimi için ideal."], "en": ["Sarıgerme beach", "The most famous part of Sarıgerme’s 7 km of fine golden sand is SARÇED Beach: 200 m long, 100 m wide and a Blue Flag winner every year since 2007. Baba Island opposite is ideal for a first dive."]}, {"c": "breakfast", "big": "~870 mm", "tr": ["Güneşli yazlar, yağmurlu kışlar", "Yılda ortalama 870 mm yağış düşer, neredeyse tamamı kasımdan marta kadar. Temmuz ve ağustosta neredeyse hiç yağmur yağmaz. Aylık ortalama sıcaklık ocakta 11 °C, temmuz ve ağustosta 27–28 °C civarında."], "en": ["Sunny summers, rainy winters", "About 870 mm of rain falls each year, almost all of it from November to March. July and August are practically dry. The monthly average temperature is about 11 °C in January and 27–28 °C in July and August."]}, {"c": "nature", "big": "2019", "tr": ["Sakin şehir Köyceğiz", "Köyceğiz, 2019’da İtalya’daki Cittaslow toplantısında “sakin şehir” ilan edildi. Göl kıyısındaki huzurlu yaşamı, yerel ürünleri ve doğası bu unvanı getirdi."], "en": ["Köyceğiz, a Cittaslow town", "In 2019, at the Cittaslow meeting in Italy, Köyceğiz was declared a “slow city” for its peaceful lakeside life, local produce and nature."]}, {"c": "market", "big": "80 bin ton", "tr": ["Narın, portakalın, domatesin yurdu", "Ortaca yılda yaklaşık 80 bin ton nar üretiyor; Muğla’nın narının neredeyse tamamı buradan. Portakal başta olmak üzere narenciye bahçeleri ve sera domatesi de ilçenin en önemli ürünleri."], "en": ["Home of pomegranates, oranges and tomatoes", "Ortaca grows about 80,000 tonnes of pomegranates a year, almost all of Muğla’s crop. Citrus orchards, above all oranges, and greenhouse tomatoes are its other key products."]}, {"c": "market", "big": "Turizm + tarım", "tr": ["Bölge neyle geçinir?", "Ortaca’nın ekonomisinin iki ayağı turizm ve tarım. Seralar, narenciye ve nar bahçelerinin yanında arıcılık ve Dalyan’daki kooperatif balıkçılığı da önemli geçim kaynakları."], "en": ["How does the region make a living?", "Ortaca’s economy stands on tourism and farming. Besides greenhouses and citrus and pomegranate orchards, beekeeping and the cooperative fishery in Dalyan are important sources of income."]}, {"c": "history", "big": "1. sırada", "tr": ["Türkiye’nin en pahalı kirası", "Endeksa verilerine göre metrekare başına konut kirasının en yüksek olduğu il Muğla; İstanbul bile geride kalıyor. Ekim 2026’da metrekare satış fiyatında da Muğla birinci, İstanbul ikinci oldu."], "en": ["Türkiye’s highest rents", "According to Endeksa data, Muğla has the highest housing rent per square metre in Türkiye, ahead even of İstanbul. In October 2026 Muğla also had the highest sale price per square metre, with İstanbul second."]}, {"c": "sea", "big": "1.484 km", "tr": ["Türkiye’nin en uzun kıyısı", "Muğla, 1.484 km ile Türkiye’nin en uzun kıyı şeridine sahip il. Yüzlerce koy, mavi bayraklı plajlar ve marinalar bu kıyıda."], "en": ["Türkiye’s longest coastline", "With 1,484 km, Muğla has the longest coastline of any province in Türkiye, with hundreds of bays, Blue Flag beaches and marinas."]}, {"c": "breakfast", "big": "%92", "tr": ["Dünyanın çam balı buradan", "Dünyadaki çam balının yaklaşık %92’si Türkiye’de, bunun da yaklaşık %80’i Muğla’da üretiliyor."], "en": ["The world’s pine honey", "About 92% of the world’s pine honey comes from Türkiye, and roughly 80% of that is made in Muğla."]}, {"c": "nature", "big": "%67", "tr": ["Ormanların ili", "Muğla topraklarının yaklaşık üçte ikisi ormanlarla kaplı; Türkiye’nin en yeşil illerinden biri."], "en": ["A province of forests", "About two thirds of Muğla is covered in forest, making it one of Türkiye’s greenest provinces."]}, {"c": "sea", "big": "20:00–08:00", "tr": ["Gece kaplumbağaların, gündüz insanların", "İztuzu, Akdeniz’in en önemli caretta caretta yuvalama kumsallarından biri. Yuvalama döneminde kumsal gece 20:00’den sabah 08:00’e kadar kapalıdır."], "en": ["Turtles by night, people by day", "İztuzu is one of the Mediterranean’s most important loggerhead nesting beaches. During nesting season the beach is closed from 20:00 to 08:00."]}, {"c": "history", "big": "1987", "tr": ["Kaptan June’un mücadelesi", "1987’de İztuzu’da büyük bir otel inşaatı başladı. Kaptan June ve destekçilerinin kampanyasıyla proje durduruldu; bölge 1988’de Özel Çevre Koruma Bölgesi oldu."], "en": ["Kaptan June’s fight", "In 1987 work began on a large hotel at İztuzu. A campaign led by Kaptan June and her supporters stopped it, and in 1988 the area became a Specially Protected Area."]}, {"c": "nature", "big": "Sığla", "tr": ["Dünyada çok az yerde yetişen ağaç", "Anadolu sığla ağacı yalnızca Güneybatı Anadolu’da ve sınırlı olarak Rodos’ta yetişir. Doğal orman olarak en yoğun hali Köyceğiz–Dalyan çevresindedir."], "en": ["A tree found almost nowhere else", "The Oriental sweetgum grows only in southwest Anatolia and, in small numbers, on Rhodes. Its densest natural forests are around Köyceğiz and Dalyan."]}, {"c": "history", "big": "MÖ 4. yy", "tr": ["Kayaya oyulmuş mezarlar", "Dalyan’ın karşısındaki Kaunos kral mezarları MÖ 4. yüzyılda, sarp kayalığa tapınak cephesi şeklinde oyuldu."], "en": ["Tombs carved into the cliff", "The Kaunos king tombs across the river from Dalyan were carved into the cliff face in the 4th century BC, with temple-like facades."]}, {"c": "history", "big": "~8 km", "tr": ["Denizden uzaklaşan liman", "Kaunos bir zamanlar liman kentiydi. Nehrin taşıdığı alüvyonlarla kıyı ilerledi; kent bugün denizden yaklaşık 8 km içeride."], "en": ["A harbour that lost its sea", "Kaunos was once a port. River silt pushed the coastline out, and the city now lies about 8 km from the sea."]}, {"c": "spa", "big": "39–40 °C", "tr": ["Kaplıcaların faydaları", "Sultaniye’nin 2 bin yıllık kaplıcasının suyu yıl boyu 39–40 °C; geleneksel olarak eklem ağrıları ve romatizma için tercih edilir. Dalaman Kapıkargın’daki kükürtlü su ise 28 °C. Sağlık sorununuz varsa girmeden önce doktorunuza danışın."], "en": ["Benefits of the hot springs", "Sultaniye’s 2,000-year-old springs stay at 39–40 °C all year and are traditionally sought out for joint pain and rheumatism. The sulphur water at Kapıkargın in Dalaman is 28 °C. If you have a health condition, ask your doctor before bathing."]}, {"c": "history", "big": "1923", "tr": ["Hayalet köy Kayaköy", "Kayaköy’ün Rum sakinleri 1923 nüfus mübadelesiyle köyden ayrıldı. 1957 depreminden sonra köy tamamen boşaldı; bugün yüzlerce taş ev ayakta."], "en": ["Kayaköy, the ghost village", "Kayaköy’s Greek residents left in the 1923 population exchange. After the 1957 earthquake the village emptied completely; hundreds of stone houses still stand."]}, {"c": "market", "big": "Ortaca", "tr": ["Adı gibi ortada", "Ortaca, Dalaman ile Köyceğiz’in tam ortasında. Muğla’nın doğusuna da batısına da günübirlik gidebilirsiniz."], "en": ["In the middle, as the name says", "Ortaca lies right between Dalaman and Köyceğiz, so both the east and the west of Muğla are day trips away."]}];
const BLOGS = {"tr": ["Dalyan’da bir gün", "Kaunos’un hikayesi", "İztuzu ve caretta’lar: saygılı ziyaret rehberi", "Arabasız Muğla tatili", "Muğla mutfağı: Ne yenir, nerede yenir?", "En güzel 10 koy", "Muğla’da kışın ne yapılır?", "Ramazan Amca’nın gizli yerleri"], "en": ["A day in Dalyan", "The story of Kaunos", "İztuzu and the turtles: a respectful visitor’s guide", "A Muğla holiday without a car", "Muğla cuisine: what to eat and where", "The 10 most beautiful bays", "What to do in Muğla in winter", "Ramazan Amca’s secret spots"]};
window.renderPage = function(L, t){
  document.getElementById("facts").innerHTML = FACTS.map(f => `<article class="fact" style="--c:var(--c-${f.c})"><span class="big">${f.big}</span><h3>${f[L][0]}</h3><p>${f[L][1]}</p></article>`).join("");
  document.getElementById("posts").innerHTML = BLOGS[L].map(b => `<div class="post"><b>${b}</b><span class="soon">${t.soon}</span></div>`).join("");
};
